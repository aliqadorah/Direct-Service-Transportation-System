# Direct Service Transportation — build and test on every push and pull request (NFR-19, TST-01, TST-02, TST-06, TST-12…14).
# SQL Server runs as a service container; the tests use SQL authentication through DST_TEST_DB / DST_API_TEST_DB instead of the Windows
# authentication of the development PC. Every test project uses the same runner set-up (tests/Directory.Build.props: xUnit v3 on
# Microsoft.Testing.Platform with the coverage extension), so each `dotnet test --project …` below takes the same arguments (DT-225).
# Not in this workflow: the end-to-end and visual checks (tests/e2e, Playwright) — they start the host with the Windows tools of the
# development PC (installed Edge, Windows sqlcmd and taskkill) and take 30+ minutes; they are run on that PC before a release
# (docs/step9/Setup_and_Run.md §8). Nor the NFR-01 500,000-trip timing check: an explicit test that `dotnet test` leaves out, run by hand
# before a release with tools/perf/run-performance-check.* (DT-227).
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'Ci-Only-Passw0rd!' }}
          MSSQL_COLLATION: Arabic_100_CI_AI_SC_UTF8
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "true"
      SQL_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'Ci-Only-Passw0rd!' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # NuGet audit runs on restore and fails the build on known vulnerable packages (warnings are errors) — SEC-15 dependency scanning.
      - name: Restore
        run: dotnet restore DirectService.Transportation.slnx

      - name: Build
        run: dotnet build DirectService.Transportation.slnx --no-restore -c Release

      # First: the architecture tests check the layer and module rules of the platform design (a.2: project files and compiled
      # assemblies, the two decided exceptions DT-367 and E-1 only), compare every name stored in data (entity stored names, URL token labels, keys, cookies, Data
      # Protection purposes, the OpenAPI document) with the golden files of the restore tag (platform restructuring, DT-283), and check the
      # migration history: the 20 migration ids in src/Hosts/DirectService.Database, the history table, no model change against the
      # snapshot (the in-process form of `dotnet ef migrations has-pending-model-changes`, DT-294).
      - name: Architecture tests (stored names, golden files)
        run: |
          dotnet test --project tests/DirectService.Architecture.Tests -c Release --no-build \
            --coverage --coverage-output-format cobertura --coverage-output Architecture.cobertura.xml

      - name: Unit and component tests (Domain, Application, UI) with coverage
        run: |
          set -e
          for p in Domain Application UI; do
            dotnet test --project tests/DirectService.Transportation.$p.Tests -c Release --no-build \
              --coverage --coverage-output-format cobertura --coverage-output $p.cobertura.xml
          done

      # PDFs are printed with the runner's Google Chrome (/usr/bin/google-chrome, found automatically). Ubuntu 24.04 does not let
      # Chrome create its own sandbox (no unprivileged user namespaces), so it runs without it, as in the container image; it only
      # opens the application's own printout HTML with scripts off and network requests refused.
      # Both test databases are created from the migrations of src/Hosts/DirectService.Database (MasterDatabase.UseMasterDatabase).
      - name: Database and API tests (integration, isolation, security) with coverage
        env:
          DST_TEST_DB: Server=localhost,1433;Database=DirectServiceMaster_Tests;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=true;Encrypt=true
          DST_API_TEST_DB: Server=localhost,1433;Database=DirectServiceMaster_ApiTests;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=true;Encrypt=true
          Printing__NoSandbox: "true"
        run: |
          set -e
          for p in Infrastructure Api; do
            dotnet test --project tests/DirectService.Transportation.$p.Tests -c Release --no-build \
              --coverage --coverage-output-format cobertura --coverage-output $p.cobertura.xml
          done

      - name: Coverage files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/*.cobertura.xml"
          if-no-files-found: error

      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.62.1 lint docs/api/openapi-v1.json
